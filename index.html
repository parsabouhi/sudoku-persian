
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7ff">
<title>سودوکو فارسی</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f5f7ff;
 color:#26334d;
 font-family:Tahoma,Arial,sans-serif;
}
.container{
 max-width:480px;
 margin:auto;
 padding:22px 15px;
}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{
 font-size:25px;
 font-weight:bold;
 color:#586ce9;
}
h1{font-size:26px;margin-top:35px}
.sub{color:#929bad;font-size:14px}
.card{
 background:white;
 border-radius:20px;
 padding:20px;
 margin-top:14px;
 cursor:pointer;
 box-shadow:0 5px 20px #26365c0b;
}
.card h3{margin:0 0 8px}
.card p{margin:0;color:#929bad;font-size:13px}
.icon{font-size:29px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer}
.primary{
 width:100%;
 padding:16px;
 border:0;
 border-radius:15px;
 background:#586ce9;
 color:white;
 font-size:16px;
 margin-top:20px;
}
#game{display:none}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.back{
 border:0;
 background:white;
 padding:12px;
 border-radius:12px;
}
.info{
 display:flex;
 justify-content:space-between;
 color:#77819b;
 margin-top:20px;
}
.board{
 display:grid;
 grid-template-columns:repeat(9,1fr);
 border:2px solid #4059bb;
 border-radius:7px;
 overflow:hidden;
 margin-top:22px;
 background:#4059bb;
 gap:0;
}
.cell{
 aspect-ratio:1;
 display:flex;
 align-items:center;
 justify-content:center;
 background:white;
 border:0;
 border-left:1px solid #dce2ed;
 border-top:1px solid #dce2ed;
 font-size:clamp(13px,4vw,20px);
 cursor:pointer;
 user-select:none;
}

/* خطوط عمودی مربع‌های ۳×۳ */
.cell:nth-child(9n+3),
.cell:nth-child(9n+6){
 border-left:3px solid #536ce9;
}

/* خطوط افقی مربع‌های ۳×۳ */
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){
 border-bottom:3px solid #536ce9;
}

.cell.fixed{
 font-weight:bold;
 color:#26334d;
}
.cell.selected{
 background:#b9c9ff!important;
}
.cell.related{
 background:#f0f3ff;
}
.cell.same{
 background:#dce5ff;
 color:#405bdc;
}
.cell.wrong{
 color:#e34e65;
 background:#ffe8eb;
}

/* جدول رنگی */
.board.colorful .cell:nth-child(9n+1){background:#fff0ed}
.board.colorful .cell:nth-child(9n+2){background:#fff7df}
.board.colorful .cell:nth-child(9n+3){background:#e9f7ee}
.board.colorful .cell:nth-child(9n+4){background:#e9f3ff}
.board.colorful .cell:nth-child(9n+5){background:#f3eaff}
.board.colorful .cell:nth-child(9n+6){background:#ffeafa}
.board.colorful .cell:nth-child(9n+7){background:#e5f8f8}
.board.colorful .cell:nth-child(9n+8){background:#fff0df}
.board.colorful .cell:nth-child(9n+9){background:#eef0ff}
.board.colorful .cell.selected{background:#b9c9ff!important}

.numbers{
 display:grid;
 grid-template-columns:repeat(9,1fr);
 gap:6px;
 margin-top:20px;
}
.numbers button{
 border:1px solid #e2e7f8;
 background:white;
 color:#5268df;
 border-radius:13px;
 min-height:49px;
 font-size:19px;
 font-weight:bold;
}
.numbers button.active{
 background:#586ce9;
 color:white;
}
.actions{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.actions button{
 flex:1;
 border:0;
 background:white;
 color:#5368e9;
 padding:13px 4px;
 border-radius:12px;
 font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<section id="home">
<header>
<div class="logo">SUDOKU</div>
<div>🧩 سودوکو فارسی</div>
</header>

<h1>سلام! آماده‌ای؟ 👋</h1>
<p class="sub">یک مدل جدول انتخاب کن.</p>

<div class="card" onclick="start('آسان',9,false)">
<div class="icon">🌱</div>
<h3>سودوکوی آسان</h3>
<p>مناسب شروع و تمرین</p>
</div>

<div class="card" onclick="start('متوسط',9,false)">
<div class="icon">🧠</div>
<h3>سودوکوی متوسط</h3>
<p>یک چالش جذاب</p>
</div>

<div class="card" onclick="start('سخت',9,false)">
<div class="icon">🔥</div>
<h3>سودوکوی سخت</h3>
<p>برای حرفه‌ای‌ها</p>
</div>

<div class="card" onclick="start('کوچک',4,false)">
<div class="icon">🎯</div>
<h3>سودوکوی کوچک ۴×۴</h3>
<p>یک جدول سریع و ساده</p>
</div>

<div class="card" onclick="start('رنگی',9,true)">
<div class="icon">🎨</div>
<h3>سودوکوی رنگی</h3>
<p>جدول با خانه‌های رنگارنگ</p>
</div>

<button class="primary" onclick="start('متوسط',9,false)">
شروع بازی
</button>
</section>

<section id="game">
<div class="top">
<button class="back" onclick="home()">← بازگشت</button>
<strong id="level"></strong>
</div>

<div class="info">
<span>⏱ <span id="timer">۰۰:۰۰</span></span>
<span id="errors">اشتباهات: ۰</span>
</div>

<div class="board" id="board"></div>
<div class="numbers" id="numbers"></div>

<div class="actions">
<button onclick="erase()">پاک کردن</button>
<button onclick="hint()">راهنمایی</button>
<button onclick="newGame()">جدول جدید</button>
</div>
</section>

</div>

<script>
let puzzle=[],solution=[],initial=[];
let selected=null,active=null;
let mistakes=0,seconds=0,clock=null;
let size=9,colorful=false;

const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function makeSolution(){
 let rows=shuffle([0,1,2]).flatMap(g=>
  shuffle([0,1,2]).map(x=>g*3+x)
 );
 let cols=shuffle([0,1,2]).flatMap(g=>
  shuffle([0,1,2]).map(x=>g*3+x)
 );
 let nums=shuffle([1,2,3,4,5,6,7,8,9]);
 return rows.map(r=>cols.map(c=>
  nums[(r*3+Math.floor(r/3)+c)%9]
 ));
}

function makeSmall(){
 let base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
 return base;
}

function start(level,s,color){
 size=s;
 colorful=color;
 document.getElementById('home').style.display='none';
 document.getElementById('game').style.display='block';
 document.getElementById('level').textContent=level;
 newGame();
}

function newGame(){
 clearInterval(clock);
 seconds=0;
 mistakes=0;
 selected=null;
 active=null;

 if(size===4){
  solution=makeSmall();
  puzzle=solution.map(r=>r.slice());
  shuffle(Array.from({length:16},(_,i)=>i))
   .slice(7).forEach(i=>{
    puzzle[Math.floor(i/4)][i%4]=0;
   });
 }else{
  solution=makeSolution();
  puzzle=solution.map(r=>r.slice());
  let level=document.getElementById('level').textContent;
  let count=level==='آسان'?35:level==='سخت'?52:43;
  shuffle(Array.from({length:81},(_,i)=>i))
   .slice(0,count).forEach(i=>{
    puzzle[Math.floor(i/9)][i%9]=0;
   });
 }

 initial=puzzle.map(r=>r.slice());
 render();
 updateErrors();

 clock=setInterval(()=>{
  seconds++;
  document.getElementById('timer').textContent=
   fa(String(Math.floor(seconds/60)).padStart(2,'0'))+':'+
   fa(String(seconds%60).padStart(2,'0'));
 },1000);
}

function render(){
 let board=document.getElementById('board');
 board.innerHTML='';
 board.style.gridTemplateColumns=`repeat(${size},1fr)`;
 board.classList.toggle('colorful',colorful);

 puzzle.forEach((row,r)=>row.forEach((v,c)=>{
  let cell=document.createElement('div');
  cell.className='cell';

  if(initial[r][c])cell.classList.add('fixed');

  if(size===9){
   if(c===2||c===5)
    cell.style.borderLeft='3px solid #536ce9';
   if(r===2||r===5)
    cell.style.borderBottom='3px solid #536ce9';
  }else{
   if(c===1)cell.style.borderLeft='3px solid #536ce9';
   if(r===1)cell.style.borderBottom='3px solid #536ce9';
  }

  if(selected&&selected[0]===r&&selected[1]===c)
   cell.classList.add('selected');
  else if(selected&&(selected[0]===r||selected[1]===c))
   cell.classList.add('related');

  if(v&&active===v)cell.classList.add('same');

  cell.textContent=v?fa(v):'';

  cell.onclick=()=>{
   selected=[r,c];
   render();
  };

  board.appendChild(cell);
 }));

 let nums=document.getElementById('numbers');
 nums.innerHTML='';
 nums.style.gridTemplateColumns=`repeat(${size},1fr)`;

 for(let n=1;n<=size;n++){
  let b=document.createElement('button');
  b.textContent=fa(n);
  if(active===n)b.classList.add('active');
  b.onclick=()=>put(n);
  nums.appendChild(b);
 }
}

function put(n){
 active=n;
 if(!selected){render();return;}

 let [r,c]=selected;
 if(initial[r][c]){render();return;}

 if(solution[r][c]!==n){
  mistakes++;
  updateErrors();
  render();
  return;
 }

 puzzle[r][c]=n;
 render();

 if(puzzle.every((row,r)=>row.every((v,c)=>v===solution[r][c]))){
  clearInterval(clock);
  setTimeout(()=>alert('آفرین! جدول را حل کردی 🎉'),100);
 }
}

function erase(){
 if(!selected)return;
 let [r,c]=selected;
 if(!initial[r][c]){
  puzzle[r][c]=0;
  render();
 }
}

function hint(){
 if(!selected)return;
 let [r,c]=selected;
 if(initial[r][c])return;
 puzzle[r][c]=solution[r][c];
 render();
}

function updateErrors(){
 document.getElementById('errors').textContent=
 'اشتباهات: '+fa(mistakes);
}

function home(){
 clearInterval(clock);
 document.getElementById('game').style.display='none';
 document.getElementById('home').style.display='block';
}
</script>
</body>
</html>
