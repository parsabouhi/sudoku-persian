
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سودوکو فارسی</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f6fc;color:#25304a;
 font-family:Tahoma,Arial,sans-serif
}
.container{max-width:480px;margin:auto;padding:22px 15px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#586ce9}
h1{font-size:25px;margin-top:35px}
.sub{color:#8c95a9;font-size:14px}
.card{
 background:white;border-radius:20px;padding:19px;
 margin-top:14px;cursor:pointer;
 box-shadow:0 5px 20px #26365c0b
}
.card h3{margin:0 0 8px}
.card p{margin:0;color:#929bad;font-size:13px}
.icon{font-size:28px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer}
.primary{
 width:100%;padding:16px;border:0;border-radius:15px;
 background:#586ce9;color:white;font-size:16px;margin-top:20px
}
#game{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.back{border:0;background:white;padding:12px;border-radius:12px}
.info{display:flex;justify-content:space-between;color:#77819b;margin-top:20px}
.board{
 display:grid;grid-template-columns:repeat(9,1fr);
 border:2px solid #5369d8;border-radius:7px;
 overflow:hidden;margin-top:22px;background:#5369d8;gap:0
}
.cell{
 aspect-ratio:1;display:flex;align-items:center;
 justify-content:center;background:white;
 border:1px solid #e2e6f0;
 font-size:clamp(13px,4vw,20px);
 cursor:pointer;user-select:none
}
.cell:nth-child(3n){border-left:2px solid #7589e6}
.cell:nth-child(27n),.cell:nth-child(54n){
 border-bottom:2px solid #7589e6
}
.cell.fixed{font-weight:bold;color:#28334e}
.cell.selected{background:#b9c9ff!important}
.cell.related{background:#f0f3ff}
.cell.same{background:#dce5ff;color:#405bdc}
.cell.error{color:#e34e65;background:#ffe8eb}
.numbers{
 display:grid;grid-template-columns:repeat(9,1fr);
 gap:6px;margin-top:20px
}
.numbers button{
 border:1px solid #e2e7f8;background:white;
 color:#5268df;border-radius:13px;
 min-height:48px;font-size:19px;font-weight:bold
}
.numbers button.active{background:#586ce9;color:white}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{
 flex:1;border:0;background:white;color:#5368e9;
 padding:13px 4px;border-radius:12px;font-size:12px
}
</style>
</head>
<body>
<div class="container">

<section id="home">
<header>
<div class="logo">SUDOKU</div>
<div>🧩 سودوکو فارسی</div>
</header>

<h1>سلام! آماده‌ای؟ 👋</h1>
<p class="sub">یک جدول انتخاب کن و شروع کن.</p>

<div class="card" onclick="start('آسان')">
<div class="icon">🌱</div>
<h3>سودوکوی آسان</h3>
<p>مناسب شروع و تمرین</p>
</div>

<div class="card" onclick="start('متوسط')">
<div class="icon">🧠</div>
<h3>سودوکوی متوسط</h3>
<p>یک چالش جذاب</p>
</div>

<div class="card" onclick="start('سخت')">
<div class="icon">🔥</div>
<h3>سودوکوی سخت</h3>
<p>برای حرفه‌ای‌ها</p>
</div>

<button class="primary" onclick="start('متوسط')">
شروع بازی
</button>
</section>

<section id="game">
<div class="top">
<button class="back" onclick="home()">← بازگشت</button>
<strong id="level"></strong>
</div>

<div class="info">
<span>⏱ <span id="timer">۰۰:۰۰</span></span>
<span id="errors">اشتباهات: ۰</span>
</div>

<div class="board" id="board"></div>
<div class="numbers" id="numbers"></div>

<div class="actions">
<button onclick="erase()">پاک کردن</button>
<button onclick="hint()">راهنمایی</button>
<button onclick="newGame()">جدول جدید</button>
</div>
</section>
</div>

<script>
let puzzle=[],solution=[],initial=[];
let selected=null,active=null;
let mistakes=0,seconds=0,clock=null;

const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
 let j=Math.floor(Math.random()*(i+1));
 [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function makeSolution(){
 let rows=shuffle([0,1,2]).flatMap(g=>
 shuffle([0,1,2]).map(x=>g*3+x));
 let cols=shuffle([0,1,2]).flatMap(g=>
 shuffle([0,1,2]).map(x=>g*3+x));
 let nums=shuffle([1,2,3,4,5,6,7,8,9]);

 return rows.map(r=>cols.map(c=>
 nums[(r*3+Math.floor(r/3)+c)%9]
 ));
}

function start(level){
 document.getElementById('home').style.display='none';
 document.getElementById('game').style.display='block';
 document.getElementById('level').textContent=level;
 newGame();
}

function newGame(){
 clearInterval(clock);
 seconds=0;mistakes=0;selected=null;active=null;

 solution=makeSolution();
 puzzle=solution.map(r=>r.slice());

 let level=document.getElementById('level').textContent;
 let count=level==='آسان'?35:level==='سخت'?52:43;

 shuffle(Array.from({length:81},(_,i)=>i))
 .slice(0,count).forEach(i=>{
 puzzle[Math.floor(i/9)][i%9]=0;
 });

 initial=puzzle.map(r=>r.slice());
 render();
 updateErrors();

 clock=setInterval(()=>{
 seconds++;
 document.getElementById('timer').textContent=
 fa(String(Math.floor(seconds/60)).padStart(2,'0'))+':'+
 fa(String(seconds%60).padStart(2,'0'));
 },1000);
}

function render(){
 let board=document.getElementById('board');
 board.innerHTML='';

 puzzle.forEach((row,r)=>row.forEach((v,c)=>{
 let cell=document.createElement('div');
 cell.className='cell';

 if(initial[r][c])cell.classList.add('fixed');

 if(c===2||c===5)cell.style.borderLeft='2px solid #7589e6';
 if(r===2||r===5)cell.style.borderBottom='2px solid #7589e6';

 if(selected&&selected[0]===r&&selected[1]===c)
 cell.classList.add('selected');
 else if(selected&&(selected[0]===r||selected[1]===c))
 cell.classList.add('related');

 if(v&&active===v)cell.classList.add('same');

 cell.textContent=v?fa(v):'';

 cell.onclick=()=>{
 selected=[r,c];
 render();
 };

 board.appendChild(cell);
 }));

 let nums=document.getElementById('numbers');
 nums.innerHTML='';

 for(let n=1;n<=9;n++){
 let b=document.createElement('button');
 b.textContent=fa(n);

 if(active===n)b.classList.add('active');

 b.onclick=()=>put(n);
 nums.appendChild(b);
 }
}

function put(n){
 active=n;
 if(!selected){render();return;}

 let [r,c]=selected;
 if(initial[r][c]){render();return;}

 if(solution[r][c]!==n){
 mistakes++;
 updateErrors();
 render();
 return;
 }

 puzzle[r][c]=n;
 render();

 if(puzzle.every((row,r)=>row.every((v,c)=>v===solution[r][c]))){
 clearInterval(clock);
 setTimeout(()=>alert('آفرین! جدول را حل کردی 🎉'),100);
 }
}

function erase(){
 if(!selected)return;
 let [r,c]=selected;
 if(!initial[r][c]){
 puzzle[r][c]=0;
 render();
 }
}

function hint(){
 if(!selected)return;
 let [r,c]=selected;
 if(initial[r][c])return;
 puzzle[r][c]=solution[r][c];
 render();
}

function updateErrors(){
 document.getElementById('errors').textContent=
 'اشتباهات: '+fa(mistakes);
}

function home(){
 clearInterval(clock);
 document.getElementById('game').style.display='none';
 document.getElementById('home').style.display='block';
}
</script>
</body>
</html>
